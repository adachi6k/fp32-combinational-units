name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator
          verilator --version
      - name: Build SoftFloat
        run: make softfloat
      - name: Run deterministic smoke tests
        run: make smoke

  lint-and-frontend-compatibility:
    runs-on: ubuntu-24.04
    needs: smoke-tests
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator
          verilator --version
      - name: Verilator lint
        run: make lint
